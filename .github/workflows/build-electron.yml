name: Build Electron Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Build Electron App
        run: npm run electron:build # Pastikan script ini sesuai dengan yang ada di package.json Anda

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Windows-Installer
          path: dist-electron/*.exe # Sesuaikan dengan folder output build Anda
